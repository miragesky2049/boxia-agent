# 必须位于仓库根目录：pre-commit 默认从根目录发现配置并安装 Git 钩子。
# 后端：ruff；前端：oxlint + prettier；通用：空白、文件结尾、YAML/TOML、私钥、大文件。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: backend-ruff
        name: backend ruff check
        entry: uv run --project backend ruff check
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: backend-ruff-format
        name: backend ruff format check
        entry: uv run --project backend ruff format --check
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      # 20261124：pnpm 在 manifest 与 node_modules 不一致时会在 run/exec 前自动 install
      # 并重写 pnpm-lock.yaml（实测一次提交里耗 2m22s、锁文件 +6 -2），钩子不该改依赖，
      # 故统一用 --config.verify-deps-before-run=false 关闭；依赖同步交 ops/dev.sh 或手工 install
      - id: frontend-oxlint
        name: frontend oxlint
        entry: pnpm --dir frontend/admin --config.verify-deps-before-run=false exec oxlint src
        language: system
        files: ^frontend/admin/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: frontend-prettier
        name: frontend prettier check
        entry: pnpm --dir frontend/admin --config.verify-deps-before-run=false run format:check
        language: system
        files: ^frontend/admin/.*\.(ts|tsx|css|json)$
        # pnpm --dir 把工作目录切到 frontend/admin，pre-commit 传入的仓库根相对路径在该目录下无法解析
        pass_filenames: false
