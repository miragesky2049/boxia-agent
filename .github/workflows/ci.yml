name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint / typecheck / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      ROOT_DOMAIN: example.com
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/boxia_agent_test
      JWT_SECRET: test-jwt-secret-0123456789abcdef0123456789abcdef
      LOG_LEVEL: WARNING
    services:
      postgres:
        # 迁移 0022 需要 vector 扩展，原生 postgres 镜像无 pgvector，必须用带扩展的镜像
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy internal web
      - name: Pytest with coverage
        run: uv run pytest --cov=internal --cov=web --cov-report=term-missing --cov-fail-under=80
      - name: Alembic drift check
        run: uv run alembic check

  frontend:
    name: Admin typecheck / lint / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/admin/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/admin/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Format check
        run: pnpm run format:check
      - name: Unit tests
        run: pnpm run test:coverage
      - name: Build
        run: pnpm run build

  frontend-user:
    name: User typecheck / lint / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/user
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/user/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/user/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      ROOT_DOMAIN: localhost
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/boxia_agent_e2e
      JWT_SECRET: test-jwt-secret-0123456789abcdef0123456789abcdef
      LOG_LEVEL: WARNING
      E2E_USERNAME: admin
      # E2E 在 localhost 上运行，走本地请求头切换租户
      ALLOW_TENANT_HEADER: 'true'
    services:
      postgres:
        # 同上：alembic upgrade head 在迁移 0022 需要 pgvector 扩展
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boxia_agent_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # 应用 KV 缓存走 redis（apps 会话短期记忆）；RedisKvCache 不吞连接错误，CI 必须提供
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/admin/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/admin/pnpm-lock.yaml
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Generate E2E credentials
        id: creds
        run: |
          password="E2e-$(openssl rand -hex 16)-9"
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
      - name: Prepare database and admin
        working-directory: backend
        env:
          E2E_PASSWORD: ${{ steps.creds.outputs.password }}
        run: |
          uv run alembic upgrade head
          ADMIN_USERNAME="$E2E_USERNAME" ADMIN_PASSWORD="$E2E_PASSWORD" \
            ADMIN_MUST_CHANGE_PASSWORD=false ADMIN_ROLE=superadmin \
            uv run python -m scripts.create_admin
      - name: Start backend
        working-directory: backend
        run: |
          nohup uv run uvicorn web.app_admin:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1
      - name: Install frontend dependencies
        working-directory: frontend/admin
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend/admin
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend/admin
        env:
          E2E_PASSWORD: ${{ steps.creds.outputs.password }}
        run: pnpm run e2e
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/admin/playwright-report
            frontend/admin/test-results
          retention-days: 7
      - name: Show backend log
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"

  docker:
    name: Docker build / Trivy scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend/admin
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: boxia-agent-${{ matrix.name }}:ci
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: boxia-agent-${{ matrix.name }}:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
