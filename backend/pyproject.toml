[project]
name = "boxia-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "bcrypt>=4.2",
    "fastapi>=0.115.0",
    "fastmcp>=4.0.0",
    "httpx>=0.28",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "pypdf>=5.1",
    "pgvector>=0.3",
    "python-docx>=1.1",
    "redis[hiredis]>=5.0",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.10",
    "python-dotenv>=1.0.0",
    "python-json-logger>=3.2,<4",
    "sqlalchemy>=2.0.36,<2.1",
    "sqlalchemy-utils>=0.41",
    "uuid6>=2024.7.10",
    "uvicorn[standard]>=0.32.0",
    "celery[redis]>=5.4",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP046"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["uuid.UUID"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["internal", "web"]

[[tool.mypy.overrides]]
module = ["internal.domain.*", "internal.application.*", "internal.infrastructure.config.*", "web.deps.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["migrations.*", "scripts.*"]
ignore_errors = true

[tool.coverage.run]
source = ["internal", "web"]
omit = ["internal/infrastructure/config/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
